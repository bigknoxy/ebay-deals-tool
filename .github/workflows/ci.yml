name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Least privilege by default. Individual jobs raise it only if they must.
permissions:
  contents: read

# One run per ref: a new push cancels the previous, in-flight run.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHONUNBUFFERED: "1"

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: byte-compile
        run: python -m compileall -q ebay_deals tests tools scripts
      - name: import check
        run: python -c "import ebay_deals.cli, ebay_deals.scan, ebay_deals.mcp_server"
      - name: shell scripts are valid
        run: |
          for script in scripts/*.sh; do sh -n "$script"; done
          python3 -m py_compile scripts/bump_version.py
      # PyYAML only for this step: the runtime package and the offline test
      # suite stay stdlib-only, and no-third-party.sh proves it.
      - name: workflow YAML
        run: |
          python -m pip install --quiet "pyyaml==6.0.2"
          python scripts/check-workflows.py
      - name: ruff
        env:
          # Pinned to the version the tree was formatted and linted with, so a
          # new ruff release cannot turn CI red on a repo nobody touched.
          RUFF_VERSION: "0.16.10"
        run: |
          python -m pip install --quiet "ruff==${RUFF_VERSION}"
          ruff check .
          ruff format --check .
      # Fails if a credential, personal path, or machine identifier was
      # committed. This repo is public, so the scan is a hard gate.
      - name: secret and PII scan
        run: python -m tools.privacy_scan

  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python }}
      - name: tests
        run: python -m tests.run

  # Enforces the statement-coverage floor. Always runs, never path-filtered.
  coverage:
    runs-on: ubuntu-latest
    env:
      COVERAGE_THRESHOLD: "80"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: install coverage
        run: python -m pip install --quiet coverage
      - name: coverage gate
        run: sh scripts/coverage.sh

  # pip-audit runs in the org security workflow; this job covers the one
  # packaging-time risk unique to this repo: importing with no third-party
  # dependency present. A zero-dependency package must stay that way.
  no-deps:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: assert the package is stdlib-only
        run: sh scripts/no-third-party.sh

  # docs is intentionally NOT path-filtered: branch protection requires a check
  # by name, so a docs-only PR must still see this job report.
  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: docs drift
        run: python -m tests.run --docs

  pr-title:
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: amannn/action-semantic-pull-request@e32d7e603df1aa1ba07e981f2a23455dee596825 # v5
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          types: |
            feat
            fix
            docs
            test
            ci
            chore
            refactor
            perf
            build
            style
            revert
          requireScope: false
          subjectPattern: ^\S.*$
          subjectPatternError: |
            The subject "{subject}" in the pull request title "{title}" must be
            non-empty and start with a non-space character.

  smoke:
    runs-on: ubuntu-latest
    needs: [lint, test]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: smoke
        run: sh scripts/smoke.sh
