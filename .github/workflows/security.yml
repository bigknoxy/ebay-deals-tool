name: Security

# Thin caller for the org-wide reusable security workflow. See
# bigknoxy/.github/.github/workflows/security-reusable.yml for what each job does.
#
# language: python  -> CodeQL (python) + pip-audit
# has_docker: false -> no trivy jobs, this repo ships no container image
on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: '0 6 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: security-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  security:
    uses: bigknoxy/.github/.github/workflows/security-reusable.yml@main
    permissions:
      contents: read
      security-events: write
      pull-requests: write
    with:
      language: python
      has_docker: false
      fail_on_severity: moderate
    secrets: inherit
