[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ebay-deals-tool"
# Resolved at build time from the git tag, so the tag is the single source of
# truth and main needs no bot commit (main is PR-only).
dynamic = ["version"]
description = "Repeatable, auditable eBay deal hunting with a CLI and a zero-dependency MCP server"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
keywords = ["ebay", "deal", "hunting", "mcp", "cli", "scraping"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Utilities",
]
# Intentionally empty: the tool and its test suite are stdlib-only. CI installs
# coverage and ruff as development tools, never as runtime requirements.
dependencies = []

[project.urls]
Homepage = "https://github.com/bigknoxy/ebay-deals-tool"
Issues = "https://github.com/bigknoxy/ebay-deals-tool/issues"
Changelog = "https://github.com/bigknoxy/ebay-deals-tool/blob/main/CHANGELOG.md"

[project.scripts]
ebay-deals = "ebay_deals.cli:main"

[tool.setuptools]
packages = ["ebay_deals"]

[tool.setuptools.dynamic]
version = { attr = "ebay_deals.__version__" }

[tool.coverage.run]
source = ["ebay_deals"]
# Statement coverage is the gate. The only conditional network code is the
# transport, which tests exercise through mocks, so branch numbers there would
# measure the mocks rather than the code.
branch = false

[tool.coverage.report]
show_missing = true
skip_empty = true

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
# Correctness and import hygiene. PTH is deliberately excluded: this codebase
# uses os.path consistently and rewriting every path call adds review surface
# without changing behaviour.
select = ["E", "F", "W", "I", "UP", "B", "C4", "SIM", "RET"]
ignore = [
    "E501",    # line length is enforced by the formatter, not the linter
    "SIM108",  # ternary is not always clearer than an if/else
    "RET504",  # naming the return value before returning it aids debugging
    "B008",    # argparse defaults are function calls by design
]

[tool.ruff.lint.per-file-ignores]
"tests/run.py" = ["E402"]
"tools/privacy_scan.py" = ["S603"]
